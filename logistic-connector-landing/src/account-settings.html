<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quản lý tài khoản</title>
  <style>
    :root{
      --primary:#0b74da;
      --primary-hover:#085aa7;
      --text:#0b2136;
      --muted:#6b7280;
      --bg:#f5f8fc;
      --card:#ffffff;
      --border:rgba(15,23,42,0.08);
      --ok:#10b981;
      --warn:#f59e0b;
      --err:#ef4444;
      --shadow-sm:0 2px 8px rgba(15,23,42,0.04);
      --shadow-md:0 4px 16px rgba(15,23,42,0.08);
      --shadow-lg:0 12px 32px rgba(15,23,42,0.12);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    a{text-decoration:none;color:inherit}
    body{
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background:linear-gradient(135deg,#e0f2fe 0%,#f0f9ff 50%,#e0e7ff 100%);
      color:var(--text);
      line-height:1.6;
      min-height:100vh;
    }
    header{
      background:rgba(255,255,255,0.95);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
      box-shadow:var(--shadow-sm);
      position:sticky;
      top:0;
      z-index:100;
    }
    .wrap{max-width:1100px;margin:0 auto;padding:14px 24px}
    .breadcrumb{
      display:inline-flex;
      gap:10px;
      align-items:center;
      color:var(--muted);
      font-weight:700;
      transition:all 0.2s ease;
    }
    .breadcrumb:hover{color:var(--text);transform:translateX(-2px)}
    .breadcrumb svg{width:20px;height:20px}
    main{
      max-width:1100px;
      margin:24px auto;
      padding:0 24px;
      display:grid;
      grid-template-columns:280px 1fr;
      gap:24px;
    }
    .sidebar{
      background:rgba(255,255,255,0.95);
      backdrop-filter:blur(10px);
      border:1px solid var(--border);
      border-radius:16px;
      padding:20px;
      box-shadow:var(--shadow-sm);
      height:fit-content;
      position:sticky;
      top:90px;
    }
    .sidebar-title{
      font-size:12px;
      color:var(--muted);
      margin:0 0 16px 8px;
      text-transform:uppercase;
      letter-spacing:0.5px;
      font-weight:700;
    }
    .nav{display:flex;flex-direction:column;gap:8px}
    .nav a{
      padding:12px 16px;
      border-radius:10px;
      color:var(--text);
      border:1px solid transparent;
      font-weight:600;
      font-size:14px;
      transition:all 0.2s ease;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .nav a:hover{
      border-color:var(--primary);
      background:rgba(11,116,218,0.05);
      transform:translateX(4px);
    }
    .nav a.active{
      border-color:var(--primary);
      background:rgba(11,116,218,0.08);
      color:var(--primary);
    }
    .content{display:flex;flex-direction:column;gap:20px}
    .card{
      background:rgba(255,255,255,0.95);
      backdrop-filter:blur(10px);
      border:1px solid var(--border);
      border-radius:16px;
      padding:28px;
      box-shadow:var(--shadow-md);
      transition:all 0.3s ease;
    }
    .card:hover{
      transform:translateY(-2px);
      box-shadow:var(--shadow-lg);
    }
    .card h2{
      margin:0 0 20px;
      font-size:22px;
      font-weight:800;
      color:var(--text);
    }
    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    .field{margin-bottom:16px}
    .field label{
      display:block;
      font-weight:700;
      margin-bottom:8px;
      color:var(--text);
      font-size:14px;
    }
    .field input,.field select,.field textarea{
      width:100%;
      padding:12px 16px;
      border-radius:10px;
      border:2px solid var(--border);
      font-size:15px;
      font-family:inherit;
      background:#fafcff;
      color:var(--text);
      transition:all 0.2s ease;
    }
    .field input:focus,.field select:focus,.field textarea:focus{
      outline:none;
      border-color:var(--primary);
      background:#fff;
      box-shadow:0 0 0 3px rgba(11,116,218,0.1);
    }
    .field input.valid{border-color:var(--ok)}
    .field input.invalid{border-color:var(--err)}
    .chip-group{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:12px;
    }
    .chip{
      padding:8px 16px;
      border-radius:20px;
      border:2px solid rgba(11,116,218,0.2);
      background:rgba(11,116,218,0.05);
      color:var(--primary);
      font-weight:700;
      font-size:13px;
      cursor:pointer;
      transition:all 0.25s ease;
    }
    .chip:hover{
      background:rgba(11,116,218,0.12);
      border-color:var(--primary);
      transform:scale(1.05);
    }
    .chip.active{
      background:linear-gradient(135deg,var(--primary),#3b82f6);
      color:#fff;
      border-color:var(--primary);
      box-shadow:var(--shadow-sm);
    }
    .rating{
      display:flex;
      align-items:center;
      gap:12px;
      margin-top:8px;
    }
    .stars{display:flex;gap:6px}
    .star{
      font-size:24px;
      color:#d1d5db;
      cursor:pointer;
      transition:all 0.2s ease;
    }
    .star:hover{transform:scale(1.2)}
    .star.active{color:#f59e0b}
    .rating input[type="number"]{
      width:80px;
      padding:8px 12px;
      border-radius:8px;
      border:2px solid var(--border);
      font-size:14px;
      font-weight:700;
      text-align:center;
    }
    .hidden{display:none !important}
    .actions{
      margin-top:20px;
      display:flex;
      gap:12px;
    }
    .btn{
      padding:12px 20px;
      border-radius:10px;
      border:none;
      background:linear-gradient(135deg,var(--primary),#3b82f6);
      color:#fff;
      font-weight:700;
      font-size:15px;
      cursor:pointer;
      box-shadow:var(--shadow-md);
      transition:all 0.3s ease;
    }
    .btn:hover{
      transform:translateY(-2px);
      box-shadow:var(--shadow-lg);
    }
    .btn-secondary{
      background:#fff;
      color:var(--text);
      border:2px solid var(--border);
      box-shadow:none;
    }
    .btn-secondary:hover{
      background:rgba(11,116,218,0.05);
      border-color:var(--primary);
    }
    .muted{
      color:var(--muted);
      font-size:13px;
      margin-top:8px;
    }
    .success-msg{
      color:var(--ok);
      font-weight:600;
      font-size:14px;
      margin-top:12px;
      padding:10px 14px;
      background:rgba(16,185,129,0.1);
      border-left:3px solid var(--ok);
      border-radius:8px;
      display:none;
    }
    .success-msg.show{display:block;animation:slideIn 0.3s ease}
    .error-msg{
      color:var(--err);
      font-weight:600;
      font-size:14px;
      margin-top:12px;
      padding:10px 14px;
      background:rgba(239,68,68,0.1);
      border-left:3px solid var(--err);
      border-radius:8px;
      display:none;
    }
    .error-msg.show{display:block;animation:slideIn 0.3s ease}
    @keyframes slideIn{
      from{opacity:0;transform:translateX(-10px)}
      to{opacity:1;transform:translateX(0)}
    }
    @media(max-width:1024px){
      main{grid-template-columns:1fr}
      .sidebar{position:static}
    }
    @media(max-width:640px){
      .row{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="breadcrumb" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Về Trang chủ</span>
      </a>
    </div>
  </header>
  <main>
    <aside class="sidebar">
      <div class="sidebar-title">Cài đặt</div>
      <nav class="nav">
        <a href="#profile" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
          <span>Thông tin tài khoản</span>
        </a>
        <a href="#security">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Bảo mật</span>
        </a>
      </nav>
    </aside>
    <section class="content">
      <div class="card" id="profile">
        <h2>Thông tin tài khoản</h2>
        <div class="row">
          <div class="field" id="fldName">
            <label>Họ và tên</label>
            <input id="name" type="text" placeholder="Nguyễn Văn A" />
          </div>
          <div class="field" id="fldContact">
            <label>Email / SĐT</label>
            <input id="contact" type="text" placeholder="email@example.com hoặc số điện thoại" />
          </div>
          <div class="field" id="fldCompany">
            <label>Tên công ty</label>
            <input id="company" type="text" placeholder="Công ty TNHH..." />
          </div>
          <div class="field" id="fldTaxid">
            <label>Mã số thuế</label>
            <input id="taxid" type="text" placeholder="10–13 chữ số" />
          </div>
        </div>
        <div id="servicesBlock" class="field hidden" style="margin-top:16px">
          <label>Dịch vụ cung cấp (3PL)</label>
          <div class="chip-group" id="serviceChips">
            <span class="chip" data-val="transport">🚚 Vận chuyển</span>
            <span class="chip" data-val="documents">📄 Quản lý chứng từ</span>
            <span class="chip" data-val="warehouse">🏢 Kho hàng</span>
            <span class="chip" data-val="loading">📦 Xếp dỡ</span>
            <span class="chip" data-val="planning">🗓️ Lập kế hoạch</span>
          </div>
        </div>
        <div id="ratingBlock" class="field hidden" style="margin-top:16px">
          <label>Xếp hạng (1–5 sao)</label>
          <div class="rating">
            <div class="stars" id="stars">
              <span class="star" data-score="1">★</span>
              <span class="star" data-score="2">★</span>
              <span class="star" data-score="3">★</span>
              <span class="star" data-score="4">★</span>
              <span class="star" data-score="5">★</span>
            </div>
            <input type="number" id="ratingInput" min="1" max="5" step="1" value="5" />
          </div>
          <div class="muted">Sao do khách hàng đánh giá tổng hợp</div>
        </div>
        <div class="actions">
          <button class="btn" id="saveProfile">Lưu thông tin</button>
          <button class="btn btn-secondary" id="resetProfile">Đặt lại</button>
        </div>
        <div class="success-msg" id="saveMsg"></div>
      </div>
      <div class="card" id="security">
        <h2>Bảo mật</h2>
        <div class="row">
          <div class="field">
            <label>Mật khẩu mới</label>
            <input id="newPwd" type="password" placeholder="Ít nhất 6 ký tự" />
          </div>
          <div class="field">
            <label>Xác nhận mật khẩu</label>
            <input id="confirmPwd" type="password" placeholder="Nhập lại mật khẩu" />
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="changePwd">Đổi mật khẩu</button>
        </div>
        <div class="success-msg" id="pwdSuccessMsg"></div>
        <div class="error-msg" id="pwdErrorMsg"></div>
      </div>
    </section>
  </main>
  <script>
    // Prefill from localStorage and show fields by role
    const nameEl = document.getElementById('name');
    const contactEl = document.getElementById('contact');
    const companyEl = document.getElementById('company');
    const taxidEl = document.getElementById('taxid');
    const role = localStorage.getItem('lc-role');
    const fldName = document.getElementById('fldName');
    const fldContact = document.getElementById('fldContact');
    const fldCompany = document.getElementById('fldCompany');
    const fldTaxid = document.getElementById('fldTaxid');
    const servicesBlock = document.getElementById('servicesBlock');
    const ratingBlock = document.getElementById('ratingBlock');

    // Store initial values for reset
    let initialData = {};

    try{
      initialData = {
        name: localStorage.getItem('lc-name') || '',
        contact: localStorage.getItem('lc-contact') || '',
        company: localStorage.getItem('lc-company') || '',
        taxid: localStorage.getItem('lc-taxid') || ''
      };
      nameEl.value = initialData.name;
      contactEl.value = initialData.contact;
      companyEl.value = initialData.company;
      taxidEl.value = initialData.taxid;
    }catch(e){}

    // Role-specific visibility
    if(role==='3pl'){
      // 3PL: show company + taxid, hide customer fields
      fldName.classList.add('hidden');
      fldContact.classList.add('hidden');
      fldCompany.classList.remove('hidden');
      fldTaxid.classList.remove('hidden');
      servicesBlock.classList.remove('hidden');
      ratingBlock.classList.remove('hidden');
    } else {
      // Customer (default): show name/contact (+optional taxid), hide company
      fldName.classList.remove('hidden');
      fldContact.classList.remove('hidden');
      fldCompany.classList.add('hidden');
      fldTaxid.classList.remove('hidden');
      servicesBlock.classList.add('hidden');
      ratingBlock.classList.add('hidden');
    }

    // Initialize services chips from localStorage
    try{
      const selectedServices = JSON.parse(localStorage.getItem('lc-3pl-services') || '[]');
      document.querySelectorAll('#serviceChips .chip').forEach(chip => {
        if(selectedServices.includes(chip.dataset.val)) chip.classList.add('active');
        chip.addEventListener('click',()=>{
          chip.classList.toggle('active');
        });
      });
      const savedRating = parseInt(localStorage.getItem('lc-3pl-rating') || '5', 10);
      document.getElementById('ratingInput').value = savedRating;
      updateStars(savedRating);
      document.querySelectorAll('#stars .star').forEach(star => {
        star.addEventListener('click',()=>{
          const score = parseInt(star.dataset.score,10);
          document.getElementById('ratingInput').value = score;
          updateStars(score);
        });
      });
      document.getElementById('ratingInput').addEventListener('input', (e)=>{
        let val = Math.max(1, Math.min(5, parseInt(e.target.value||'5',10)));
        e.target.value = val;
        updateStars(val);
      });
    }catch(e){}

    function updateStars(score){
      document.querySelectorAll('#stars .star').forEach(star => {
        const s = parseInt(star.dataset.score,10);
        if(s <= score){ star.classList.add('active'); } else { star.classList.remove('active'); }
      });
    }

    function showMessage(elementId, message, duration = 3000){
      const el = document.getElementById(elementId);
      if(!el) return;
      el.textContent = message;
      el.classList.add('show');
      setTimeout(()=>{
        el.classList.remove('show');
      }, duration);
    }

    document.getElementById('saveProfile').addEventListener('click',()=>{
      try{
        if(nameEl.value) localStorage.setItem('lc-name', nameEl.value.trim());
        if(contactEl.value) localStorage.setItem('lc-contact', contactEl.value.trim());
        if(companyEl.value) localStorage.setItem('lc-company', companyEl.value.trim());
        if(taxidEl.value) localStorage.setItem('lc-taxid', taxidEl.value.trim());
        // Save selected services & rating for 3PL
        if(role==='3pl'){
          const svcs = Array.from(document.querySelectorAll('#serviceChips .chip.active')).map(c=>c.dataset.val);
          localStorage.setItem('lc-3pl-services', JSON.stringify(svcs));
          const rating = document.getElementById('ratingInput').value;
          localStorage.setItem('lc-3pl-rating', String(rating));
        }
        // Update initial data
        initialData = {
          name: nameEl.value.trim(),
          contact: contactEl.value.trim(),
          company: companyEl.value.trim(),
          taxid: taxidEl.value.trim()
        };
        showMessage('saveMsg', '✓ Đã lưu thông tin thành công!');
      }catch(e){ 
        showMessage('saveMsg', '✗ Không thể lưu (trình duyệt chặn)'); 
      }
    });

    document.getElementById('resetProfile').addEventListener('click',()=>{
      nameEl.value = initialData.name;
      contactEl.value = initialData.contact;
      companyEl.value = initialData.company;
      taxidEl.value = initialData.taxid;
      showMessage('saveMsg', '↺ Đã đặt lại về giá trị ban đầu');
    });

    document.getElementById('changePwd').addEventListener('click',()=>{
      const newPwd = document.getElementById('newPwd');
      const confirmPwd = document.getElementById('confirmPwd');
      const n = newPwd.value;
      const c = confirmPwd.value;
      
      if(n.length < 6){
        showMessage('pwdErrorMsg', '✗ Mật khẩu phải có ít nhất 6 ký tự');
        return;
      }
      if(n!==c){
        showMessage('pwdErrorMsg', '✗ Xác nhận mật khẩu không khớp');
        return;
      }
      showMessage('pwdSuccessMsg', '✓ Đã cập nhật mật khẩu thành công!');
      newPwd.value = '';
      confirmPwd.value = '';
    });

    // Active nav link on scroll
    const navLinks = document.querySelectorAll('.nav a');
    const sections = document.querySelectorAll('.card');
    
    function highlightNav(){
      let current = '';
      sections.forEach(section => {
        const sectionTop = section.offsetTop;
        if(window.pageYOffset >= sectionTop - 100){
          current = section.getAttribute('id');
        }
      });
      navLinks.forEach(link => {
        link.classList.remove('active');
        if(link.getAttribute('href') === '#' + current){
          link.classList.add('active');
        }
      });
    }

    window.addEventListener('scroll', highlightNav);
  </script>
</body>
</html>
